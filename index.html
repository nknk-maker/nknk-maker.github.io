<script>
/* ================= 巨大数: log域の実数 =================
 T: 非負の塔数 {k,m}  値 = exp^k(m)   (k=0: m<1e15 の普通の数, k>=1: m in [ln 1e15, 1e15))
 V: 正の実数 v を ln v = s*t (s=±1, t は T) で保持                         */
const TT = 1e15, LT = Math.log(TT);
function mkT(k, m) {
  if (k === 0) { if (m < TT) return { k: 0, m: m < 0 ? 0 : m }; k = 1; m = Math.log(m); }
  while (m >= TT) { k++; m = Math.log(m); }
  while (k >= 1 && m < LT) { k--; m = Math.exp(m); }
  return { k, m };
}
const tCmp = (a, b) => (a.k - b.k) || (a.m - b.m);
const tExp = a => mkT(a.k + 1, a.m);
function tLn(a) {
  if (a.k >= 2) return { s: 1, t: mkT(a.k - 1, a.m) };
  if (a.k === 1) return { s: 1, t: { k: 0, m: a.m } };
  if (a.m >= 1) return { s: 1, t: { k: 0, m: Math.log(a.m) } };
  return { s: -1, t: { k: 0, m: -Math.log(Math.max(a.m, 1e-300)) } };
}
function tAdd(a, b) {
  let h = a, l = b; if (tCmp(a, b) < 0) { h = b; l = a; }
  if (h.k === 0) return mkT(0, h.m + l.m);
  if (h.k >= 2) return h;
  const ll = l.k === 0 ? (l.m > 0 ? Math.log(l.m) : -Infinity) : l.m;
  return mkT(1, h.m + Math.log1p(Math.exp(ll - h.m)));
}
function tSub(a, b) {
  if (tCmp(a, b) <= 0) return { k: 0, m: 0 };
  if (a.k === 0) return mkT(0, a.m - b.m);
  if (a.k >= 2) return a;
  const lb = b.k === 0 ? (b.m > 0 ? Math.log(b.m) : -Infinity) : b.m;
  const r = Math.exp(lb - a.m); if (r >= 1) return { k: 0, m: 0 };
  return mkT(1, a.m + Math.log1p(-r));
}
const sVal = S => S.s > 0 ? tExp(S.t) : (S.t.k === 0 ? { k: 0, m: Math.exp(-S.t.m) } : { k: 0, m: 0 });
function tMul(x, y) {
  if ((x.k === 0 && x.m === 0) || (y.k === 0 && y.m === 0)) return { k: 0, m: 0 };
  return sVal(sAdd(tLn(x), tLn(y)));
}
function sAdd(x, y) {
  if (x.s === y.s) return { s: x.s, t: tAdd(x.t, y.t) };
  const c = tCmp(x.t, y.t); if (c === 0) return { s: 1, t: { k: 0, m: 0 } };
  return c > 0 ? { s: x.s, t: tSub(x.t, y.t) } : { s: y.s, t: tSub(y.t, x.t) };
}
const sNeg = x => ({ s: -x.s, t: x.t });
/* V の演算 (V は S と同形) */
function fromNum(c) { const l = Math.log(c); return { s: l >= 0 ? 1 : -1, t: { k: 0, m: Math.abs(l) } }; }
const ONE = fromNum(1), TWO = fromNum(2), HALFV = fromNum(0.5), EPSV = fromNum(1e-6);
const LN2V = fromNum(Math.LN2), LN4V = fromNum(Math.log(4));
const vMul = (a, b) => sAdd(a, b);
const vInv = a => sNeg(a);
const vCmp = (a, b) => a.s !== b.s ? a.s - b.s : (a.s > 0 ? tCmp(a.t, b.t) : -tCmp(a.t, b.t));
function vAdd(a, b) {
  const h = vCmp(a, b) >= 0 ? a : b, l = h === a ? b : a;
  const d = sAdd(h, sNeg(l)).t;
  const add = d.k === 0 ? Math.log1p(Math.exp(-d.m)) : 0;
  return sAdd(h, { s: 1, t: { k: 0, m: add } });
}
function vSub(a, b) {
  if (vCmp(a, b) <= 0) return EPSV;
  const d = sAdd(a, sNeg(b)).t;
  const r = d.k === 0 ? Math.exp(-d.m) : 0;
  if (r >= 1) return EPSV;
  return r === 0 ? a : sAdd(a, { s: -1, t: { k: 0, m: -Math.log1p(-r) } });

const vExp = a => ({ s: 1, t: a.s > 0 ? tExp(a.t) : (a.t.k === 0 ? { k: 0, m: Math.exp(-a.t.m) } : { k: 0, m: 0 }) });

function vPow(a, b) {
  const bv = b.s > 0 ? tExp(b.t) : (b.t.k === 0 ? { k: 0, m: Math.exp(-b.t.m) } : { k: 0, m: 0 });
  return { s: a.s, t: tMul(a.t, bv) };
}
function toNum(v) { if (v.t.k === 0 && v.t.m < 700) return Math.exp(v.s * v.t.m); return v.s > 0 ? Infinity : 0; }
/* 威力 sr (単調): 人数・ボス判定に使う */
function srOf(v) { if (v.s < 0) return 0; const t = v.t; return 8 * (t.k + Math.log10(1 + t.m) / 15); }
function fmtNum(x) {
  if (x < 1e5) return x >= 100 ? x.toFixed(0) : x >= 1 ? (+x.toFixed(2)).toString() : x.toPrecision(2);
  let e = Math.floor(Math.log10(x) + 1e-9), m = x / 10 ** e; if (m >= 9.995) { m /= 10; e++; } return m.toFixed(2) + 'e+' + e;
}

  const t = v.t;
  if (t.k === 0) {
    if (t.m < 11) return fmtNum(Math.exp(t.m));

    return (10 ** (L - N)).toFixed(2) + 'e+' + (N > 1e6 ? N.toExponential(2) : N);

  return k <= 3 ? 'e^'.repeat(k) + t.m.toFixed(1) : 'e↑↑' + k + '·' + t.m.toFixed(1);

/* ================= 関数ツリー ================= */
const X_ = { t: 'x' }, C = v => ({ t: 'c', v });
const isC = n => n.t === 'c';
function Add(a, b) {
  if (isC(a) && isC(b)) return C(a.v + b.v);
  if (isC(a) && a.v === 0) return b; if (isC(b) && b.v === 0) return a;
  return { t: 'add', a, b };
}
function Mul(a, b) {
  if (isC(a) && isC(b)) return C(a.v * b.v);
  if ((isC(a) && a.v === 0) || (isC(b) && b.v === 0)) return C(0);
  if (isC(a) && a.v === 1) return b; if (isC(b) && b.v === 1) return a;
  return { t: 'mul', a, b };
}
function Inv(a) { if (a.t === 'inv') return a.a; if (isC(a) && a.v !== 0) return C(1 / a.v); return { t: 'inv', a }; }
function Pow(a, b) { if (isC(b) && b.v === 1) return a; if (isC(b) && b.v === 0) return C(1); return { t: 'pow', a, b }; }
const Op = (n, a) => ({ t: 'op', n, a });
const SubC = (a, v) => isC(a) ? C(Math.max(a.v - v, 0)) : { t: 'subc', a, v };
const Min = (a, b) => ({ t: 'min', a, b });

function mapTree(n, fn) { // 共有を保つ再構築
  const memo = new Map();
  const go = u => {
    if (memo.has(u)) return memo.get(u);
    let r = fn(u, go);
    memo.set(u, r); return r;
  };
  return go(n);
}
function compose(f, g) { // f(g(x))
  return mapTree(f, (u, go) => {
    switch (u.t) {
      case 'x': return g;
      case 'c': return u;
      case 'add': return Add(go(u.a), go(u.b));
      case 'mul': return Mul(go(u.a), go(u.b));
      case 'pow': return Pow(go(u.a), go(u.b));
      case 'op': return Op(u.n, go(u.a));
      case 'inv': return Inv(go(u.a));
      case 'subc': return SubC(go(u.a), u.v);
      case 'min': return Min(go(u.a), go(u.b));
    }
  });
}
function treeSize(n) { const s = new Set(); (function w(u) { if (s.has(u)) return; s.add(u); if (u.a) w(u.a); if (u.b) w(u.b); })(n); return s.size; }

/* 導関数 (符号は無視した |f'| で扱う) */
const DOP = {
  exp: u => Op('exp', u), ln: u => Inv(u), exp2: u => Mul(C(Math.LN2), Op('exp2', u)),
  sq: u => Mul(C(2), u), sqrt: u => Inv(Mul(C(2), Op('sqrt', u))),
  gamma: u => Mul(Op('gamma', u), Op('psi', u)), fact: u => Mul(Op('fact', u), Op('psi', Add(u, C(1)))),
  zeta: u => Op('dzeta', u), dzeta: u => Mul(C(Math.LN2), Op('dzeta', u)),
  pi: u => Inv(Op('ln', u)), pn: u => Add(Op('ln', u), C(1)), psi: u => Inv(u),
  binv: u => Mul(Op('binv', u), Add(C(Math.log(4)), Inv(Mul(C(2), u))))
};
function D(n) {
  const memo = new Map();
  const go = u => {
    if (memo.has(u)) return memo.get(u);
    let r;
    switch (u.t) {
      case 'x': r = C(1); break;
      case 'c': r = C(0); break;

    gx.shadowBlur = 0; gx.fillStyle = '#fff'; const o = P([0, 0]); gx.beginPath(); gx.arc(o[0], o[1], 3, 0, 7); gx.fill();
  }
  if (gAnim.t >= 1) gAnim.drawn = true;
}

/* ================= フロア構築 ================= */
function startFloor() {
  const f = GS.floor, det = GS.mode === 'det', hard = det && GS.size === 3;
  const n = Math.min(7 + f, 11), spacing = (hard ? 54 : 46) - f * 2, base = (hard ? 9 : 11) + f * 0.7;
  GS.baseSpeed = base * (1 - 0.15 * relicCount('slow')); GS.spacing = spacing;
  clearGates(); GS.gates = []; GS.gi = 0;
  const pairs = []; for (let i = 0; i < n; i++) pairs.push(det ? detGatePair(GS.size, f) : fnGatePair(f));
  const z0 = 70; pairs.forEach((p, i) => { const g = spawnGate(-(z0 + i * spacing), p, det ? 'det' : 'fn'); g.eyeDone = false; GS.gates.push(g); });
  GS.bossZ = -(z0 + n * spacing + 80); buildTrack(-GS.bossZ);
  const best = det ? bestDetSr(pairs, GS.st.det) : bestFnSr(pairs, GS.st);
  const ratio = Math.min(0.9, 0.7 + 0.05 * f) * (1 - 0.1 * relicCount('boost'));
  GS.bossSr = Math.max(best * ratio, power(GS.st) + 2.5, 3);
  GS.bossName = (det ? BOSS_DET : BOSS_FN)[f % 4]; buildBoss(GS.bossZ, GS.bossName, BOSS_COL[f % 4]);
  GS.timerMax = ((-GS.bossZ - 55) / GS.baseSpeed) * 0.78 + 8 * relicCount('time'); GS.timer = GS.timerMax;
  GS.shield = relicCount('shield'); crowd.x = 0; crowd.z = 0; GS.targetX = 0; GS.phase = 'ready'; GS.readyT = 1.5; GS.winFlag = false;
  $('bossBar').hidden = true; $('hud').hidden = false; $('overlay').hidden = true; $('cursorChip').hidden = false; refreshHUD(); updateTimerHUD();
  popup('FLOOR ' + (f + 1), '#ffd23f'); sfx.neutral();
}
function startRun(mode, size) {
  ensureAudio(); GS.mode = mode; GS.size = size; GS.floor = 0; GS.relics = {}; GS.st = mode === 'fn' ? fnStart() : detStart(size); GS.popped = false;
  crowd.n = 8; gAnim = { t: 1, from: null, to: null, kind: '' }; startFloor();
}

/* ================= ゲート通過 ================= */
function previewGates() {
  const g = GS.gates[GS.gi]; if (!g || g.eyeDone || relicCount('eye') < 1) return; g.eyeDone = true;
  g.pair.forEach((gate, i) => { const nx = gate.kind === 'fn' ? fnApply(GS.st, gate) : detApply(GS.st, gate); const d = power(nx) - power(GS.st); setEye(g.sides[i], d > 0.03 ? '▲' : d < -0.03 ? '▼' : '＝'); });
}
function passGate(g) {
  const side = crowd.x < 0 ? 0 : 1, gate = g.pair[side], old = GS.st; let nx = gate.kind === 'fn' ? fnApply(old, gate) : detApply(old, gate);
  let d = power(nx) - power(old), guarded = false;
  if (d < -0.03 && GS.shield > 0) { GS.shield--; nx = old; guarded = true; }
  g.done = true; GS.st = nx; const px = crowd.x, pz = g.z, col = side === 0 ? 0xff3f9b : 0x2fc7ff;
  const label = gate.kind === 'fn' ? gate.l.replace(/\s+/g, '') : 'det ' + fmtBig(gate.d);
  burst(px, 4, pz, col, 70, 9, 4); g.sides[side].panel.visible = false; g.sides[side ^ 1].mat.opacity = 0.25;
  const flipped = nx.kind === 'det' && ((old.det < 0n) !== (nx.det < 0n)) && !guarded;
  if (guarded) { popup('🛡 ガード！', '#9b6bff'); flash('#9b6bff', .3); sfx.neutral(); }
  else if (flipped) { const neg = nx.det < 0n; popup(neg ? '反転！ ' + label : '復活！ ' + label, neg ? '#d9a6ff' : '#ffd23f'); flash(neg ? '#b44dff' : '#ffd23f', .4); neg ? sfx.bad() : sfx.good(); GS.shake = neg ? 0.8 : 0.3; burst(px, 3, pz, neg ? 0xb44dff : 0xffd23f, 120, 12, 5); }
  else if (d > 0.03) { popup(label + '  ▲', '#7dff6b'); flash('#7dff6b', .25 + Math.min(.3, d / 20)); sfx.good(); burst(px, 3, pz, 0xc6ff3d, 90 + Math.min(120, d * 12), 12, 5); GS.fovK = 1; }
  else if (d < -0.03) { popup(label + '  ▼', '#ff4a4a'); flash('#ff4a4a', .35); sfx.bad(); GS.shake = 0.9; burst(px, 2, pz, 0xff4a4a, 90, 10, 3); }
  else { popup(label + '  ＝', '#ffd23f'); sfx.neutral(); }
  GS.gi++; refreshHUD(); updateTimerHUD();
}

/* ================= ボス戦 ================= */
function beginBoss(timeUp) {
  GS.phase = 'boss'; GS.bt = 0; GS.endDone = false; GS.power = power(GS.st); const need = GS.bossSr;
  GS.winFlag = GS.power >= need; GS.hpEnd = GS.winFlag ? 0 : Math.max(0.12, 1 - Math.pow(Math.max(0, GS.power) / need, 1.5) * 0.9);
  $('bossBar').hidden = false; $('bossName').textContent = 'BOSS: ' + GS.bossName; $('bossHp').style.width = '100%';
  $('bossNeed').textContent = GS.mode === 'fn' ? `必要威力 ${need.toFixed(1)}　あなた ${GS.power.toFixed(1)}` : `必要: det ≥ 10^${(need / 1.6).toFixed(1)}　あなた: ${fmtBig(GS.st.det)}`;
  if (timeUp) { popup('TIME UP', '#ff4a4a'); flash('#ff4a4a', .5); sfx.bad(); } else { popup('BOSS!!', '#ff3f9b'); sfx.boom(); }
  GS.bossFromZ = crowd.z; GS.bossFromX = crowd.x; GS.shake = 1;
}
function updateBoss(dt) {
  GS.bt += dt; const t = GS.bt, B = boss; B.core.rotation.y += dt * 0.8; B.core.rotation.x += dt * 0.4; B.spikes.rotation.y -= dt * 0.5; B.spikes.rotation.z += dt * 0.3; B.ring1.rotation.x += dt * 1.1; B.ring2.rotation.y += dt * 1.6;
  const tz = GS.bossZ + 19;
  if (t < 1.4) { const k = Math.min(1, t / 1.4), e = k * k * (3 - 2 * k); crowd.z = GS.bossFromZ + (tz - GS.bossFromZ) * e; crowd.x = GS.bossFromX * (1 - e); crowd.speedK = 1.4; }
  else if (t < 4.2) {
    crowd.z = tz; crowd.x *= 0.9; const k = (t - 1.4) / 2.8, e = 1 - Math.pow(1 - k, 2); GS.moving = true;
    $('bossHp').style.width = (100 * (1 - (1 - GS.hpEnd) * e)) + '%'; B.group.position.z = GS.bossZ + Math.sin(t * 40) * 0.25 * (1 - k * 0.3);
    if (Math.random() < dt * 30) { burst((Math.random() - 0.5) * 8, 4 + Math.random() * 10, GS.bossZ + 6, Math.random() < .5 ? 0xffd23f : 0xff3f9b, 22, 9, 3); sfx.hit(); }
    const sx = (Math.random() - 0.5) * 0.4; B.core.position.x = sx; B.core.scale.setScalar(1 + Math.sin(t * 30) * 0.03);
    if (!GS.winFlag) crowd.target = Math.max(8, crowdOf(GS.st) * (1 - 0.8 * k) | 0);
  } else if (GS.phase === 'boss' && !GS.endDone) {
    GS.endDone = true; GS.endT = 0; B.core.position.x = 0; B.core.scale.setScalar(1);
    if (GS.winFlag) { popup('BOSS DOWN!', '#ffd23f'); flash('#ffffff', .85); sfx.boom(); sfx.win(); GS.shake = 1.4; for (let i = 0; i < 12; i++) burst((Math.random() - 0.5) * 14, 4 + Math.random() * 12, GS.bossZ + Math.random() * 6, [0xffd23f, 0xff3f9b, 0x2fc7ff, 0xc6ff3d][i % 4], 90, 16, 8); B.dead = true; $('bossHp').style.width = '0%'; }
    else { popup('敗北…', '#ff4a4a'); sfx.bad(); flash('#ff4a4a', .6); crowd.target = 0; burst(crowd.x, 3, crowd.z, 0xff4a4a, 160, 12, 5); }
  }
  if (GS.endDone) {
    GS.endT += dt; if (B.dead) { B.group.scale.multiplyScalar(1 - dt * 1.6); B.group.rotation.y += dt * 9; if (Math.random() < dt * 40) burst((Math.random() - .5) * 10, 8, GS.bossZ + 4, 0xffd23f, 25, 14, 6); }
    if (GS.endT > 2.0 && GS.phase === 'boss') { GS.phase = 'between'; GS.winFlag ? showRelics() : showOver(); }
  }
}

/* ================= オーバーレイ ================= */
function overlay(html) { const o = $('overlay'); o.innerHTML = '<div class="card">' + html + '</div>'; o.hidden = false; $('cursorChip').hidden = true; }
function showRelics() {
  GS.floor++; saveBest(GS.floor); const keys = Object.keys(RELICS).sort(() => Math.random() - 0.5).slice(0, 3);
  overlay(`<h2 class="big">FLOOR ${GS.floor} CLEAR!</h2><p class="sub">遺物をひとつ選んで次のフロアへ（遺物は重ねがけできる）</p><div class="relics">${keys.map(k => `<button class="relicbtn" data-k="${k}" type="button"><span class="ic">${RELICS[k].ic}</span><b>${RELICS[k].name}</b><span>${RELICS[k].ds}</span></button>`).join('')}</div>`);
  $('overlay').querySelectorAll('.relicbtn').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; GS.relics[k] = (GS.relics[k] || 0) + 1; GS.endDone = false; boss && removeBoss(); startFloor(); }));
}
function showOver() {
  saveBest(GS.floor); const st = GS.st, v = st.kind === 'fn' ? 'f(x) = ' + showT(st.tree) : 'det = ' + fmtBig(st.det);
  overlay(`<h2 class="big" style="color:var(--red)">GAME OVER</h2><p class="sub">フロア ${GS.floor + 1} のボス「${GS.bossName}」に敗れた</p><div class="stat">${v.length > 120 ? v.slice(0, 119) + '…' : v}</div><div class="stat">到達: ${GS.floor} フロア制覇　ベスト: ${loadBest()}</div><button class="btn" id="again" type="button">もう一度</button><button class="seg" id="toMenu" type="button">モード選択へ</button>`);
  $('again').onclick = () => { GS.endDone = false; startRun(GS.mode, GS.size); }; $('toMenu').onclick = () => toMenu();
}
function toMenu() { GS.phase = 'menu'; GS.endDone = false; $('hud').hidden = true; clearGates(); removeBoss(); buildTrack(300); crowd.n = 24; crowd.x = 0; crowd.z = 0; setCrowdColor(0xc6ff3d); drawMenu(); }
function drawMenu() {
  const o = $('overlay'); o.innerHTML = ''; o.appendChild(document.getElementById('startTpl').content.cloneNode(true)); o.hidden = false; $('cursorChip').hidden = true; bindMenu();
}
function bindMenu() {
  const sync = () => { $('sz2').setAttribute('aria-pressed', GS.size === 2); $('sz3').setAttribute('aria-pressed', GS.size === 3); };
  $('sz2').onclick = () => { GS.size = 2; sync(); showBest(); }; $('sz3').onclick = () => { GS.size = 3; sync(); showBest(); }; sync();
  const showBest = () => { const k = GS.mode; const f = (m, s) => { try { return +localStorage.getItem('orderrush-best-' + m + (m === 'det' ? s : '')) || 0; } catch (e) { return 0; } }; $('bestLine').textContent = `ベスト（制覇フロア）　関数 ${f('fn')}　行列式2×2 ${f('det', 2)}　3×3 ${f('det', 3)}`; };
  showBest(); $('goFn').onclick = () => startRun('fn', GS.size); $('goDet').onclick = () => startRun('det', GS.size);
}

/* ================= 入力 ================= */
const clampX = x => Math.max(-(HALF - 1.6), Math.min(HALF - 1.6, x));
function setPointerX(cx) { GS.targetX = clampX(((cx / window.innerWidth) * 2 - 1) * (HALF - 1.4) * 1.25); }
window.addEventListener('pointermove', e => { const c = $('cursorChip'); c.style.transform = `translate(${e.clientX + 14}px,${e.clientY + 14}px)`; if (GS.phase === 'run' || GS.phase === 'ready') setPointerX(e.clientX); });
window.addEventListener('pointerdown', e => { ensureAudio(); if (GS.phase === 'run' || GS.phase === 'ready') { setPointerX(e.clientX); if (e.pointerType === 'mouse' && e.target === glCanvas) GS.sprintMouse = true; } });
window.addEventListener('pointerup', () => { GS.sprintMouse = false; });
const spb = $('sprint'); spb.addEventListener('pointerdown', e => { e.stopPropagation(); GS.sprintBtn = true; spb.classList.add('on'); ensureAudio(); }); ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => spb.addEventListener(ev, () => { GS.sprintBtn = false; spb.classList.remove('on'); }));
window.addEventListener('keydown', e => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') GS.keyL = true; if (e.code === 'ArrowRight' || e.code === 'KeyD') GS.keyR = true; if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { GS.sprintKey = true; e.preventDefault(); } if (e.code === 'KeyM') muted = !muted; });
window.addEventListener('keyup', e => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') GS.keyL = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') GS.keyR = false; if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') GS.sprintKey = false; });
window.addEventListener('blur', () => { GS.keyL = GS.keyR = GS.sprintKey = GS.sprintMouse = false; });

/* ================= メインループ ================= */
let last = performance.now(), camPos = new THREE.Vector3(0, 9, 14), camLook = new THREE.Vector3(0, 1, -20), lastTick = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; GS.t += dt; tick(dt, GS.t);
}
function tick(dt, t) {
  let moving = false, sprint = false;
  if (GS.phase === 'ready') { GS.readyT -= dt; if (GS.readyT <= 0) { GS.phase = 'run'; popup('GO!', '#c6ff3d'); sfx.good(); } }
  if (GS.phase === 'run' || GS.phase === 'ready') {
    if (GS.keyL) GS.targetX = clampX(GS.targetX - 16 * dt); if (GS.keyR) GS.targetX = clampX(GS.targetX + 16 * dt);
    crowd.x += (GS.targetX - crowd.x) * Math.min(1, dt * 9);
  }
  if (GS.phase === 'run') {
    sprint = GS.sprintBtn || GS.sprintKey || GS.sprintMouse; const sp = GS.baseSpeed * (sprint ? 1.75 : 1); crowd.z -= sp * dt; moving = true; crowd.speedK = sprint ? 1.5 : 1;
    GS.timer -= dt; updateTimerHUD(); previewGates();
    const g = GS.gates[GS.gi]; if (g && crowd.z <= g.z) passGate(g);
    if (GS.gi >= GS.gates.length && crowd.z <= GS.bossZ + 48) beginBoss(false);
    else if (GS.timer <= 0) { GS.gi = GS.gates.length; beginBoss(true); }
    if (GS.timer < 8 && Math.floor(GS.timer) !== Math.floor(GS.timer + dt)) sfx.tick();
  } else if (GS.phase === 'ready') { crowd.z = 0; moving = false; }
  else if (GS.phase === 'boss') { updateBoss(dt); moving = GS.bt < 1.4 || GS.bt < 4.2; }
  else if (GS.phase === 'menu') { moving = true; crowd.speedK = 0.6; }
  crowd.n += (crowd.target - crowd.n) * Math.min(1, dt * 6);
  updateCrowd(dt, t, moving && GS.phase !== 'between');
  // カメラ
  GS.shake = Math.max(0, GS.shake - dt * 2.2); GS.fovK = Math.max(0, GS.fovK - dt * 2.5);
  let cp, cl; const port = camera.userData.portrait, up = port ? 3 : 0, back = port ? 6 : 0;
  if (GS.phase === 'boss' || GS.phase === 'between') { cp = new THREE.Vector3(0, 13 + up, GS.bossZ + 46 + back); cl = new THREE.Vector3(0, 8, GS.bossZ); }
  else if (GS.phase === 'menu') { const a = t * 0.3; cp = new THREE.Vector3(Math.sin(a) * 14, 6, Math.cos(a) * 14); cl = new THREE.Vector3(0, 2, 0); }
  else { cp = new THREE.Vector3(crowd.x * 0.5, 9 + up + (sprint ? 0.8 : 0), crowd.z + 14.5 + back); cl = new THREE.Vector3(crowd.x * 0.55, 1.4, crowd.z - 22); }
  camPos.lerp(cp, Math.min(1, dt * 4)); camLook.lerp(cl, Math.min(1, dt * 5));
  camera.position.copy(camPos); if (GS.shake > 0) camera.position.add(new THREE.Vector3((Math.random() - 0.5) * GS.shake * 0.8, (Math.random() - 0.5) * GS.shake * 0.8, 0)); camera.lookAt(camLook);
  const fovT = 62 + (sprint ? 10 : 0) + GS.fovK * 8 + (port ? 10 : 0); camera.fov += (fovT - camera.fov) * Math.min(1, dt * 6); camera.updateProjectionMatrix();
  // 演出
  gateObjs.forEach(o => { if (!o.done) o.sides.forEach((s, i) => { s.panel.position.y = 4.6 + Math.sin(t * 2 + o.z + i) * 0.12; }); });
  const hue = (t * 0.1) % 1; sideMats.forEach((m, i) => m.color.setHSL((hue + i * 0.5) % 1, 0.9, 0.6));
  const stars = scene.getObjectByName('stars'); if (stars) stars.rotation.y = t * 0.01;
  updateParticles(dt); updateSpeedLines(crowd.z, sprint ? 0.55 : GS.phase === 'run' ? 0.18 : 0);
  if (GS.phase !== 'menu') { updateCrowdTag(); } else $('crowdTag').style.display = 'none';
  drawGraph(dt); renderer.render(scene, camera);
}
/* 起動 */
(function init() {
  const tpl = document.createElement('template'); tpl.id = 'startTpl'; tpl.innerHTML = $('overlay').innerHTML; document.body.appendChild(tpl);
  crowd.n = 24; crowd.target = 24; toMenu(); requestAnimationFrame(frame);
})();
</script>
